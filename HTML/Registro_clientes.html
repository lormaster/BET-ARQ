<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="registro.css">
   <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js"></script>
</head>
<body>

            <div class="Registro">

              <img src="./img/LOG.jpeg" alt="Logo-BET-ARQ">

                <form>

                    <div class="campo">
                        <input type="texto" placeholder="Nombre completo">
                        <iconify-icon class="icono" icon="material-symbols:person-rounded"></iconify-icon>
                    </div>

                    <div class="campo">
                        <input type="email" placeholder="Correo electrónico">
                         <iconify-icon class="icono" icon="material-symbols:mail"></iconify-icon>
                    </div>

                    <div class="campo">
                        <input type="tel" placeholder="Teléfono">
                         <iconify-icon class="icono" icon="ic:baseline-phone"></iconify-icon>
                    </div>

                     <div class="campo">
                    
                    <select name="documento" id="documento">

                        <option select="Tdu">Tipo de usuario</option>
                        <option>Abminitrador</option>
                        <option>Empleado</option>
                         <option>Cliente</option>

                    </select>

                 <iconify-icon
                     class="flecha"
                     icon="material-symbols:keyboard-arrow-down-rounded">
                 </iconify-icon>

                    </div>


                     <div class="campo">
                        <input type="texto" placeholder="Empresa / Organización">
                        <iconify-icon class="icono" icon="gridicons:multiple-users"></iconify-icon>
                    </div>

                    <div class="campo">
                        <input type="password" placeholder="Contraseña">
                        <iconify-icon class="icono" icon="boxicons:lock-filled"></iconify-icon>
                    </div>

                    <div class="campo">
                        <input type="password" placeholder="Confirmar contraseña">
                        <iconify-icon class="icono" icon="boxicons:lock-filled"></iconify-icon>
                    </div>

                     <button  id="btn-registrarse" type="submit">Registrarse</button>
                     </form>

                    <div class="footer">
                        <p>¿Ya tienes una cuenta?</p>
                        <p>Iniciar sesión</p>
                    </div>

 </body>
 </html>
